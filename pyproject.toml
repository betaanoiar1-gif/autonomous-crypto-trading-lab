[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-crypto-trading-lab"
version = "0.1.0"
description = "Autonomous, reproducible crypto strategy research laboratory"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "scipy>=1.13,<2",
  "jinja2>=3.1,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
